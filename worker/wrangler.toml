name = "absolute-cinema"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
# Origins allowed to call this Worker, comma-separated. The Worker echoes back
# whichever one matches the request, so one deployment serves both the live
# site and local development.
ALLOWED_ORIGINS = "https://itsjohnreid.github.io,http://localhost:8000,http://127.0.0.1:8000"

# No secrets needed: Letterboxd film pages are public and unauthenticated.
